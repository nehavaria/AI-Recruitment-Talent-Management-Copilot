[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show short test summary for failures and errors
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings

# Custom markers
markers =
    unit: Pure unit tests (no DB)
    integration: Tests that require a live MySQL connection
    slow: Tests that are slow (e.g. real STT calls)

# Minimum version
minversion = 7.0
